<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeilFace</title>
<link rel="stylesheet" href="src/page.css">
<link rel="stylesheet" href="src/sidebar.css">
</head>
<body>
<div class="vf-bg" aria-hidden="true">
  <span class="vf-ember e1"></span>
  <span class="vf-ember e2"></span>
  <span class="vf-ember e3"></span>
  <span class="vf-grain"></span>
  <span class="vf-scan"></span>
</div>

<header class="vf-head">
  <div class="vf-brand">
    <svg class="vf-mark" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="vfMarkGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFB020"/><stop offset="0.5" stop-color="#FF6B3D"/><stop offset="1" stop-color="#FF3D71"/>
        </linearGradient>
      </defs>
      <circle cx="20" cy="20" r="16" fill="none" stroke="url(#vfMarkGrad)" stroke-width="2.2"/>
      <path class="vf-mark-scan" d="M6 20h28" stroke="#B4FF39" stroke-width="1.6" stroke-linecap="round"/>
      <rect class="vf-mark-bar" x="10" y="15" width="20" height="7" rx="2.5" fill="url(#vfMarkGrad)"/>
      <path d="M13 27c2-2.6 4.6-4 7-4s5 1.4 7 4" fill="none" stroke="#FFB02088" stroke-width="1.6"/>
    </svg>
    <div class="vf-brand-text">
      <strong>VEILFACE</strong>
      <span class="vf-sub">face censor vfx · v1.0</span>
    </div>
  </div>
  <div class="vf-head-actions">
    <button id="vfSound" class="vf-icon-btn" type="button" title="Suara antarmuka" aria-pressed="true">
      <svg viewBox="0 0 24 24" class="i-sound-on"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" class="wave"/><path d="M18.6 6a8.5 8.5 0 0 1 0 12" class="wave"/></svg>
      <svg viewBox="0 0 24 24" class="i-sound-off"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <button id="vfPower" class="vf-power" type="button" aria-pressed="true" title="Master sensor wajah">
      <span class="vf-power-dot"></span><span class="vf-power-label">AKTIF</span>
    </button>
    <button id="vfClose" class="vf-icon-btn" type="button" title="Tutup sidebar (Alt+Shift+F)">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</header>

<div class="vf-statusbar">
  <span class="vf-host" id="vfHost">—</span>
  <span class="vf-pill" id="vfFacePill"><b id="vfFaces">0</b> wajah</span>
  <span class="vf-pill vf-pill-eff" id="vfEffPill">Censor Bar</span>
  <span class="vf-pill vf-pill-model" id="vfModelPill">model…</span>
</div>

<main class="vf-scroll" id="vfScroll">
  <nav class="vf-tabs" id="vfTabs" aria-label="Panel VeilFace"></nav>
</main>

<footer class="vf-foot">
  <button id="vfPanic" class="vf-btn vf-btn-danger" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 16H3l9-16z"/><path d="M12 9v5M12 16.6v.4"/></svg>
    Panic
  </button>
  <button id="vfRescan" class="vf-btn" type="button">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
    Pindai
  </button>
  <button id="vfPeek" class="vf-btn vf-btn-ghost" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
    Intip
  </button>
</footer>

<div class="vf-toast" id="vfToast" role="status" aria-live="polite" hidden>
  <span id="vfToastText"></span>
  <button id="vfToastAction" type="button" hidden>Undo</button>
</div>

<script src="src/effects.js"></script>
<script src="src/audio.js"></script>
<script src="src/sidebar.js"></script>
</body>
</html>
